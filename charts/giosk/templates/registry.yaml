{{- /* 인클러스터 이미지 레지스트리(registry:2). 이미지 빌드(Kaniko) 푸시 + 세션 풀 대상.
       registry.enabled=true 일 때만 배포되며, configmap 이 GIOSK_REGISTRY 를 이 서비스로 자동 설정한다.
       주의: 노드 containerd 가 이 레지스트리를 insecure 로 신뢰하도록 hosts.toml 구성이 필요할 수 있다
       (서비스 DNS=<release>-giosk-registry:5000). 외부 레지스트리를 쓰려면 enabled=false + registry.external 지정. */ -}}
{{- if .Values.registry.install }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "giosk.fullname" . }}-registry
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.registry.storageClass }}
  storageClassName: {{ .Values.registry.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.registry.storageSize | default "50Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "giosk.fullname" . }}-registry
  labels: { app: giosk-registry }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO 볼륨 → 롤링 금지
  selector:
    matchLabels: { app: giosk-registry }
  template:
    metadata:
      labels: { app: giosk-registry }
    spec:
      containers:
        - name: registry
          image: "{{ .Values.registry.image | default "registry:2" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: registry, containerPort: 5000 }
          env:
            - { name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet: { path: /v2/, port: registry }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "giosk.fullname" . }}-registry
---
{{- $svc := .Values.registry.service | default dict }}
{{- $svcType := $svc.type | default "ClusterIP" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "giosk.fullname" . }}-registry
  labels: { app: giosk-registry }
  {{- if and (eq $svcType "LoadBalancer") $svc.loadBalancerIP }}
  annotations:
    metallb.universe.tf/loadBalancerIPs: {{ $svc.loadBalancerIP | quote }}
  {{- end }}
spec:
  type: {{ $svcType }}
  selector: { app: giosk-registry }
  ports:
    - name: registry
      port: {{ .Values.registry.port | default 5000 }}
      targetPort: registry
{{- end }}
