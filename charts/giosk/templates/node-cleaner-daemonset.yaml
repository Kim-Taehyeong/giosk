{{- /*
Scratch 정리 DaemonSet.

Scratch(/scratch)는 노드 로컬이고 사용자별 쿼터가 없다. "임시"라고 계약된 공간이라 그게
정상이지만, 방치하면 디스크가 100% 로 차서 kubelet DiskPressure 가 걸리고 노드가 통째로
빠진다. 그래서 임계(기본 85%)를 넘으면 atime 오래된 순으로 지워 임계 아래로 되돌린다.
계정 폴더 구조는 남긴다. 재사용할 때 소유권과 경로가 유지돼야 하기 때문이다.

세션 홈은 여기서 다루지 않는다. 홈은 이미지 기반이라 각 세션이 자기 몫만 쓰고, 넘기면
커널이 ENOSPC 로 막는다. 남의 파일을 지워서 공간을 만들 이유가 없어졌다.
방치된 중단 세션 홈은 API 의 home-reaper 가 방치 일수만 보고 회수한다.
*/ -}}
{{- if and .Values.nodeCleaner.enabled .Values.storage.scratch.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "giosk.fullname" . }}-node-cleaner
  namespace: {{ .Release.Namespace }}
  labels: { app: giosk-node-cleaner }
spec:
  selector:
    matchLabels: { app: giosk-node-cleaner }
  template:
    metadata:
      labels: { app: giosk-node-cleaner }
    spec:
      # scratch 가 켜진 노드에만 둔다.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: giosk.io/scratch, operator: In, values: ["true"] }
      tolerations:
        - operator: Exists          # 물리/전용 노드에도 배치
      containers:
        - name: cleaner
          image: alpine:3.19
          securityContext: { runAsUser: 0 }   # 여러 UID 의 파일을 지워야 함
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
          env:
            - { name: INTERVAL,          value: {{ .Values.nodeCleaner.intervalSec | quote }} }
            - { name: SCRATCH_DIR,       value: "/scratch" }
            - { name: SCRATCH_THRESHOLD, value: {{ .Values.nodeCleaner.scratchThreshold | quote }} }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # 사용률(%)은 대상 경로가 속한 파일시스템 기준이다.
              usage() { df -P "$1" 2>/dev/null | awk 'NR==2{gsub("%","",$5);print $5}'; }

              # purge <dir> <threshold>
              #   임계 초과 시 atime 오래된 순으로 파일을 지워 임계 아래로 되돌린다.
              #   디렉터리 구조(계정 폴더)는 보존한다. 재사용할 때 소유권과 경로가 유지돼야 하기 때문이다.
              purge() {
                dir="$1"; th="$2"
                [ -n "$dir" ] || return 0
                [ -d "$dir" ] || return 0
                u=$(usage "$dir"); [ -n "${u:-}" ] || return 0
                [ "$u" -ge "$th" ] || return 0
                echo "[node-cleaner] $dir ${u}% >= ${th}% — purging (atime 오래된 순, ${min_age}일 이상 미접근)"
                # -atime +N : N일보다 오래 접근되지 않은 파일만. min_age=0 이면 전체 대상.
                if [ "$min_age" -gt 0 ]; then
                  find "$dir" -type f -atime +"$min_age" -printf '%A@ %p\n' 2>/dev/null
                else
                  find "$dir" -type f -printf '%A@ %p\n' 2>/dev/null
                fi | sort -n | cut -d' ' -f2- | while IFS= read -r f; do
                  cur=$(usage "$dir")
                  [ "${cur:-0}" -lt "$th" ] && break
                  rm -f "$f" 2>/dev/null
                done
                echo "[node-cleaner] $dir 정리 후 $(usage "$dir")%"
              }

              apk add --no-cache findutils >/dev/null 2>&1  # busybox find 는 -printf 미지원
              while true; do
                purge "${SCRATCH_DIR}" "${SCRATCH_THRESHOLD}"
                sleep "${INTERVAL}"
              done
          volumeMounts:
            - { name: scratch, mountPath: /scratch }
      volumes:
        - name: scratch
          hostPath: { path: {{ .Values.storage.scratch.hostPath | quote }}, type: DirectoryOrCreate }
{{- end }}
