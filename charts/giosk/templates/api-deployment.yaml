apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "giosk.fullname" . }}-api
  labels: { app: giosk-api }
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: giosk-api }
  template:
    metadata:
      labels: { app: giosk-api }
      annotations:
        # config/secret 변경 시 롤링 재시작 유도
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "giosk.fullname" . }}-api
      {{- include "giosk.controlPlaneScheduling" . | nindent 6 }}
      {{- if .Values.database.bundled }}
      # 번들 MySQL 이 접속 가능해질 때까지 api 시작을 막는다(부팅 순서를 보장해 CrashLoop 을 피한다).
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "giosk.fullname" . }}-mysql 3306; do
                echo "waiting for mysql ({{ include "giosk.fullname" . }}-mysql:3306)..."
                sleep 2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: {{ include "giosk.fullname" . }}-config }
          env:
            - name: GIOSK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "giosk.fullname" . }}-secrets, key: admin-password }
            - name: GIOSK_AGENT_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "giosk.fullname" . }}-secrets, key: agent-token }
            - name: GIOSK_DB_PASS
              valueFrom:
                secretKeyRef: { name: {{ include "giosk.fullname" . }}-secrets, key: db-password }
            - name: GIOSK_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "giosk.fullname" . }}-secrets, key: smtp-password }
            {{- if .Values.gateway.enabled }}
            # 게이트웨이가 켜져 있을 때만 주입해 API 가 토큰 URL 을 발급한다(꺼져 있으면 gatewayOn()=false 라 직접접속으로 폴백)
            - name: GIOSK_GATEWAY_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "giosk.fullname" . }}-secrets, key: gateway-secret }
            # 물리 세션 웹터미널: API 가 이 관리키로 노드에 SSH(노드 authorized_keys 가 게이트웨이 공개키 신뢰).
            - name: GIOSK_GATEWAY_SSH_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "giosk.fullname" . }}-secrets, key: gateway-ssh-key }
            {{- end }}
          # 기동 시 DB 마이그레이션(수십 개, 느린 디스크면 수십 초)이 끝나 HTTP 가 뜰 때까지
          # liveness/readiness 를 유예한다. startupProbe 성공 전엔 liveness 가 컨테이너를 죽이지 않는다.
          # 최대 대기 = periodSeconds * failureThreshold = 5 * 60 = 300s.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          {{- if .Values.storage.datasets.enabled }}
          # 데이터셋 파일 업로드용: API 가 NFS(<base>/dataset/<name>)에 직접 스트리밍 기록.
          volumeMounts:
            - { name: dataset-nfs, mountPath: /nfs-datasets }
          {{- end }}
      {{- if .Values.storage.datasets.enabled }}
      volumes:
        - name: dataset-nfs
          nfs:
            server: {{ .Values.storage.datasets.nfs.server | quote }}
            path: {{ .Values.storage.datasets.nfs.path | quote }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "giosk.fullname" . }}-api
  labels: { app: giosk-api }
spec:
  type: {{ .Values.api.service.type }}
  selector: { app: giosk-api }
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
