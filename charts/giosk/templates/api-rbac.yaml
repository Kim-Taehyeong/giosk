{{- /* API 는 client-go 로 세션 파드/PVC/PV/서비스/네임스페이스/노드/빌드Job 을 직접 관리 → ClusterRole 필요. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "giosk.fullname" . }}-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "giosk.fullname" . }}-api
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims, namespaces, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]                # 컨테이너 SSH: 세션 ns 에 사용자 authorized_keys Secret 생성/갱신(UpsertUserKeys)
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]              # 웹터미널: 세션 컨테이너로 exec 스트리밍(kubectl exec bash)
    verbs: [create, get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumes]    # 데이터셋/공유볼륨 정적 PV 생성에 create 필요(클러스터 스코프)
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "giosk.fullname" . }}-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "giosk.fullname" . }}-api
subjects:
  - kind: ServiceAccount
    name: {{ include "giosk.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
