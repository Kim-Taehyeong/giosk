{{- /* 프론트엔드 — nginx 가 정적 서빙 + /api 를 같은 오리진으로 API 에 프록시(CORS 없음).
        frontend.tls.secretName 지정 시 443 에서 HTTPS 종단(와일드카드 인증서 권장) + 80→443 리다이렉트. */ -}}
{{- $tls := .Values.frontend.tls.secretName -}}
{{- $host := .Values.frontend.domain | default "_" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "giosk.fullname" . }}-frontend-nginx
data:
  default.conf: |
    # WebSocket 업그레이드 매핑(웹터미널 /api/instances/:id/terminal). http 컨텍스트(conf.d)에서 유효.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
    {{- if $tls }}
    # HTTP → HTTPS 리다이렉트
    server {
      listen 80;
      server_name {{ $host }};
      return 301 https://$host$request_uri;
    }
    server {
      listen 443 ssl;
      server_name {{ $host }};
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      root /usr/share/nginx/html;
      index index.html;
      location / {
        try_files $uri $uri/ /index.html;
      }
      location /api/ {
        proxy_pass http://{{ include "giosk.fullname" . }}-api:{{ .Values.api.service.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket(웹터미널) 업그레이드 통과 + 유휴 연결 유지(대화형 터미널은 오래 조용할 수 있음)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 대용량 데이터셋 업로드: 기본 1MB 제한 해제 + 백엔드로 스트리밍(디스크 버퍼링 없이 진행률 정확).
        client_max_body_size 0;
        proxy_request_buffering off;
      }
    }
    {{- else }}
    server {
      listen 80;
      server_name {{ $host }};
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://{{ include "giosk.fullname" . }}-api:{{ .Values.api.service.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket(웹터미널) 업그레이드 통과 + 유휴 연결 유지(대화형 터미널은 오래 조용할 수 있음)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 대용량 데이터셋 업로드: 기본 1MB 제한 해제 + 백엔드로 스트리밍(디스크 버퍼링 없이 진행률 정확).
        client_max_body_size 0;
        proxy_request_buffering off;
      }
    }
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "giosk.fullname" . }}-frontend
  labels: { app: giosk-frontend }
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: giosk-frontend }
  template:
    metadata:
      labels: { app: giosk-frontend }
      annotations:
        # nginx 설정(포트·TLS)에 의존 → 변경 시 롤링 재시작 유도
        checksum/nginx: {{ printf "%s:%v:%s" (include "giosk.fullname" .) .Values.api.service.port $tls | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 80 }
            {{- if $tls }}
            - { name: https, containerPort: 443 }
            {{- end }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- if $tls }}
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "giosk.fullname" . }}-frontend-nginx
        {{- if $tls }}
        - name: tls
          secret:
            secretName: {{ $tls | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "giosk.fullname" . }}-frontend
  labels: { app: giosk-frontend }
spec:
  type: {{ .Values.frontend.service.type }}
  {{- if and (eq .Values.frontend.service.type "LoadBalancer") .Values.frontend.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.frontend.service.loadBalancerIP | quote }}
  {{- end }}
  selector: { app: giosk-frontend }
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
    {{- if $tls }}
    - name: https
      port: {{ .Values.frontend.service.httpsPort | default 443 }}
      targetPort: https
    {{- end }}
