{{- /* 민감 값 — 관리자 비밀번호 · node-agent 토큰 · DB 비밀번호. API/agent/MySQL 가 env 로 참조.
       생성값(agent-token/db-password)은 upgrade 마다 새로 만들면 안 된다(API↔agent 토큰 불일치 → 401,
       MySQL 비번 불일치). 기존 Secret 이 있으면 그 값을 승계한다(values 명시 > 기존 > 신규 생성). */ -}}
{{- $name := printf "%s-secrets" (include "giosk.fullname" .) -}}
{{- $prev := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $prevAgent := "" -}}
{{- $prevDB := "" -}}
{{- $prevGwSecret := "" -}}
{{- $prevGwKey := "" -}}
{{- if $prev -}}
  {{- if hasKey $prev.data "agent-token" -}}{{- $prevAgent = (index $prev.data "agent-token" | b64dec) -}}{{- end -}}
  {{- if hasKey $prev.data "db-password" -}}{{- $prevDB = (index $prev.data "db-password" | b64dec) -}}{{- end -}}
  {{- if hasKey $prev.data "gateway-secret" -}}{{- $prevGwSecret = (index $prev.data "gateway-secret" | b64dec) -}}{{- end -}}
  {{- if hasKey $prev.data "gateway-ssh-key" -}}{{- $prevGwKey = (index $prev.data "gateway-ssh-key" | b64dec) -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  admin-password: {{ .Values.admin.password | quote }}
  agent-token: {{ .Values.agentToken | default $prevAgent | default (randAlphaNum 32) | quote }}
  db-password: {{ .Values.database.password | default $prevDB | default (randAlphaNum 24) | quote }}
  smtp-password: {{ .Values.smtp.password | default "" | quote }}
  {{- /* 게이트웨이 공유 토큰키 · SSH 관리 개인키. api-deployment/gateway-deployment 가 이 키 이름을 참조한다.
     둘 다 upgrade 마다 새로 만들면 안 된다: 토큰키가 바뀌면 발급된 접속 링크가 즉시 무효가 되고,
     SSH 키가 바뀌면 이미 계정에 심어둔 authorized_keys(물리 노드)와 어긋나 SSH 가 끊긴다.
     → values 명시 > 기존 Secret 승계 > 신규 생성. */}}
  {{- if .Values.gateway.enabled }}
  gateway-secret: {{ .Values.gateway.secret | default $prevGwSecret | default (randAlphaNum 40) | quote }}
  gateway-ssh-key: {{ .Values.gateway.sshPrivateKey | default $prevGwKey | required "gateway.enabled=true 면 gateway.sshPrivateKey(PEM) 필요 — deploy.sh --with-gateway 가 생성/주입한다" | quote }}
  {{- end }}
