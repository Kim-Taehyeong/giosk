# Giosk Helm values. 설치 시점에 고정되는 설정이다.
# ConfigMap/Secret 을 거쳐 환경변수(GIOSK_*)로, 다시 backend/internal/config 로 주입된다.

image:
  api:
    repository: giosk-api          # 노드 import 방식 → 로컬 이미지명
    tag: latest
  nodeAgent:
    repository: giosk-node-agent
    tag: latest
  frontend:
    repository: giosk-frontend
    tag: latest
  gateway:
    repository: giosk-gateway
    tag: latest
  # 컨테이너 세션 SSH 사이드카. session.ssh 참고.
  sshd:
    repository: giosk-sshd
    tag: latest
  # 노드에 ctr import 한 로컬 이미지를 쓰므로 IfNotPresent
  pullPolicy: IfNotPresent

# ── 컨트롤플레인 상주 컴포넌트 스케줄 ───────────────────────────────
# api·gateway 를 컨트롤노드에 고정한다(nodeSelector + taint tolerate).
# GPU 워커는 작업 전용으로 비워 두는 편이 낫다.
controlPlane:
  enabled: false
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

# ── 실행 환경 축 (container | hybrid) ───────────────────────────────
deployment:
  mode: container        # hybrid 로 두면 SSH 물리노드 임대 기능 활성

# ── 과금 축 (credit | dynamic | free) ──────────────────────────────
# free = 크레딧·임대·동시세션 제한 없음. hybrid 와 함께 쓰면 물리 계정은 첫 SSH 때 만들어져 남는다.
billing:
  mode: credit
  credit:
    pricing: static      # static | dynamic(혼잡 surge)
    surgeIncrement: 10
  dynamic:               # 선착순
    maxLeaseHours: 8
    cooldownHours: 2
    lease:
      extensionHours: 4
      maxExtensions: 2

# ── 스토리지 전략 ──────────────────────────────────────────────────
storage:
  # 세션 홈(/home/work) 스토리지클래스. 노드 로컬(WFFC)이라 빠르다. 홈 I/O 를 NFS 로 보내면 못 쓴다.
  # 중지해도 남고 삭제할 때만 정리한다.
  localClass: local-path
  # 세션 홈 PVC 에 적는 용량(GiB). local-path 는 이걸 강제하지 않으므로 실제로는 노드 디스크만큼 쓴다.
  # 작게 적으면 사용자에게 거짓 한도를 보여주게 되니 노드 규모에 맞춰 넉넉히 둔다.
  # 노드 디스크를 지키는 건 아래 nodeCleaner 임계와 quota.homeReapPct, 그리고 디스크 알림이다.
  sessionHomeGiB: 200
  # 영속 home(~/nfs) 스토리지클래스. 노드 무관 저장소라 RWX 필수(NFS·CephFS·Longhorn-RWX).
  # 노드 로컬 클래스를 쓰면 PV 가 노드에 묶여 volume node affinity conflict 로 스케줄이 막힌다.
  persistence:
    # true = 사용자별 영속 home PVC 를 만들어 모든 세션이 공유. false = emptyDir 임시 홈만(RWX 불필요),
    # 영속이 필요하면 사용자가 볼륨을 붙인다.
    sharedHome: false
    # nfsProvisioner.install=true 면 nfsProvisioner.storageClassName 과 일치시킨다.
    storageClass: nfs
  # 데이터셋. 켜면 NFS server+path 필수(미지정 시 설치 실패).
  # <path>/dataset/<이름> 에 저장되고 세션·물리노드가 직접 마운트하므로 쓰기 가능한 export 여야 한다.
  datasets:
    enabled: false
    nfs:
      server: ""   # 데이터셋 NFS 서버 (datasets.enabled 시 필수)
      path: ""     # 데이터셋 NFS 베이스 export 경로 (datasets.enabled 시 필수)
    # 노드 로컬 캐시 루트(hostPath). NFS 데이터셋을 노드 디스크로 복사해 두면 세션이 여기서 읽는다.
    cacheHostPath: /dataset-cache
  # 노드 로컬 고속 임시 디스크. 켜면 모든 세션에 /scratch 가 계정 폴더로 마운트된다.
  scratch:
    enabled: false
    hostPath: /scratch

# ── 노드 디스크 정리 DaemonSet ──────────────────────────────────────
# scratch 와 로컬 home 은 사용자별 쿼터가 없다. 방치하면 DiskPressure 로 노드가 통째로 빠지므로,
# 임계를 넘으면 atime 이 오래된 파일부터 지운다. scratch 는 임시 공간이라 먼저, home 은 더 늦게.
# scratch.enabled 또는 physicalNodes.enabled 일 때만 배포된다.
nodeCleaner:
  enabled: true
  intervalSec: 300
  scratchThreshold: 85
  homeThreshold: 92
  homeMinAgeDays: 3     # 이보다 최근에 쓴 파일은 지우지 않는다(작업 중인 파일 보호)

# ── 인클러스터 이미지 레지스트리 (이미지 빌드용) ────────────────────
# Kaniko 빌드 푸시와 세션 이미지 풀이 여기를 쓴다. 외부 레지스트리를 쓰려면
# install=false + external 지정(둘 다 비우면 빌드 기능이 꺼진다).
registry:
  install: false         # true=인클러스터 레지스트리 번들 설치. false=외부 레지스트리(아래 external) 사용.
  external: ""           # install=false 일 때 사용할 외부 레지스트리(host:port)
  image: registry:2
  port: 5000
  # 세션 이미지 풀은 노드 containerd 가 하므로 클러스터 Service DNS 를 못 푼다. 풀까지 이 레지스트리로
  # 받으려면 LoadBalancer + 고정 IP 로 노드가 닿는 주소를 준다(노드에 hosts.toml insecure 필요).
  # 기본 ClusterIP 는 빌드 전용.
  service:
    type: ClusterIP
    loadBalancerIP: ""
  storageClass: ""       # 비우면 클러스터 기본 StorageClass
  storageSize: 50Gi
  # cosign 서명: 활성 시 빌드 파이프라인이 키 Secret(없으면 in-cluster 자동 생성)으로 이미지를 서명.
  cosign:
    enabled: false
    keySecret: giosk-cosign-key

# ── 알림 이메일 (SMTP) ─────────────────────────────────────────────
# 관리자 알림 규칙(gpu_util/gpu_temp/node_down)이 위반되면 이메일/웹훅으로 발송한다.
# host 를 비우면 이메일 발송은 생략되고 웹훅만 동작한다(웹훅 URL 은 관리자 알림 설정에서 등록).
smtp:
  host: ""              # 예: smtp.gmail.com / 사내 메일 릴레이
  port: 587             # 587(STARTTLS) 권장, 25(평문)도 가능
  username: ""          # SMTP 인증 계정(비우면 무인증 릴레이)
  password: ""          # Secret(smtp-password)로 주입
  from: ""              # 발신 주소(비우면 username 사용)

# ── 메트릭 (Prometheus + DCGM) ─────────────────────────────────────
# 대시보드 KPI/추이의 데이터 소스. GPU 메트릭은 DCGM exporter 기반.
monitoring:
  install: true           # true=kube-prometheus-stack 를 별도 릴리스로 번들 설치(대시보드/알림/디스크메트릭).
                          # false=외부 Prometheus 사용(아래 prometheusURL 지정).
  prometheusURL: ""       # install=false 일 때 외부 Prometheus URL
  dcgm:
    install: true         # true=dcgm-exporter 번들(GPU 유틸/VRAM/온도). GPU Operator 가 DCGM 을 제공하면 false.
    namespace: gpu-operator  # DCGM 파드 네임스페이스(PodMonitor 스크레이프 대상)
  # DCGM 은 물리 카드 단위라 분할 세션은 값이 갈리지 않는다. 세션별로 보려면 HAMi vGPUmonitor 도 함께 긁는다.
  hami:
    scrape: false         # HAMi 메트릭 스크레이프(분할 세션 관측). hami.install 과 함께 켠다.
    namespace: ""         # 비우면 릴리스 네임스페이스

# ── GPU 분할 스케줄러 (HAMi) ───────────────────────────────────────
# 공유(분할) GPU 세션에만 필요하다. 전용·CPU 세션은 device-plugin 만으로 동작한다.
hami:
  install: false          # true=HAMi 스케줄러를 별도 릴리스로 번들 설치

# ── 베어메탈 LoadBalancer (MetalLB) ────────────────────────────────
# 프론트/게이트웨이/레지스트리가 type=LoadBalancer 라, 온프렘이면 IP 를 할당할 LB 공급자가 필요하다.
# 클라우드(EKS/GKE 등)면 클라우드 LB 가 처리하므로 install=false.
metallb:
  install: true           # true=MetalLB 번들 설치 + 아래 ipRange 로 IPAddressPool/L2Advertisement 구성.
  ipRange: ""             # install=true 필수. 예: 10.0.0.200-10.0.0.220 (사내망 유휴 대역)

# ── 동적 RWX PV 생성기 (NFS provisioner) ───────────────────────────
# NFS 서버 자체는 외부에 미리 있어야 하고, 차트가 번들하는 것은 그 위에 PV 를 만드는 provisioner 뿐이다.
# install=false 면 이미 있는 RWX StorageClass 를 그대로 쓴다.
nfsProvisioner:
  install: true           # true=nfs-subdir-external-provisioner 번들 설치 + storageClassName 생성.
  server: ""              # NFS 서버 주소 (install=true 필수)
  path: ""                # NFS export 루트 경로 (install=true 필수)
  storageClassName: nfs   # 생성할 RWX StorageClass 이름(storage.persistence.storageClass 와 일치시킬 것)

# ── 물리 노드 (hybrid 전용) ────────────────────────────────────────
# 활성 시 외부 NFS 필수(대여 시 물리 마운트 대상) + node-agent DaemonSet 배포
physicalNodes:
  enabled: false
  # 물리 계정 UID = uidBase + 사용자ID. 재사용하지 않으며 모든 노드에서 같은 값이라 NFS 권한이 일관된다.
  # 시스템/LDAP UID 와 겹치지 않게 높게 잡는다.
  uidBase: 100000
  # 물리 SSH 계정의 home 루트(<root>/<user>). 노드 로컬이라 쿼터가 없어 nodeCleaner 가 지킨다.
  homeHostPath: /home/giosk
  nfs:                   # 외부 NFS (server+path 필수)
    server: ""
    path: ""
  nodeAgent:
    enabled: true
    nodeSelector:
      giosk.io/physical: "true"

# ── 런타임 기능 토글 초기값 (이후 system_config 에서 관리) ──────────
features:
  signupRequest: true
  datasetRegister: true
  workloadAlerts: true
  groupJoinRequest: true
  creditRequest: true

# ── 세션 웹 노출 ───────────────────────────────────────────────────
# loadbalancer = 세션마다 LoadBalancer Service, nodeport = NodeIP:NodePort(기본).
# 인증은 세션마다 생성되는 랜덤 비밀번호/토큰이라 인그레스나 DNS 가 없어도 된다.
session:
  expose: nodeport
  # 컨테이너 세션 직접 SSH. 켜면 sshd 사이드카가 붙고 사용자가 등록한 공개키로 바로 접속된다.
  # 키를 나중에 등록해도 실행 중 세션에 바로 반영된다. 주소는 expose 를 따른다.
  ssh:
    enabled: true

# ── 접속 게이트웨이 (도메인·SSH 단일 접점) ──────────────────────────
# 세션 접속을 웹 https://<세션>-<채널>.<domain>/ 과 ssh -p <sshPort> <토큰>@<host> 로 단일화한다.
# 사용자는 단기 토큰만 받고 실제 비밀(code-server 비번, jupyter 토큰, SSH 키)은 게이트웨이가 주입한다.
# 와일드카드 DNS *.<domain> 이 필요하다. 비밀값은 비워 두면 deploy.sh 가 생성한다.
gateway:
  enabled: false
  domain: gw.giosk.local     # 서브도메인 = <iid>-<ch>.<domain>. 와일드카드 DNS 필요.
  scheme: https              # 웹 URL 스킴(테스트베드 HTTP 는 "http")
  host: ""                   # SSH 접속 호스트(빈값=domain). 예: 게이트웨이 LB IP.
  sshPort: 2222              # 게이트웨이 SSH 프록시 외부 포트
  # 사내망 밖에서 들어올 때 쓸 점프 호스트(user@host). 지정하면 콘솔이 ssh -J 명령도 함께 보여준다.
  sshProxyJump: ""
  cookieTTL: 28800           # 웹 세션 쿠키 수명(초)
  consoleURL: ""             # 접근거부 페이지의 "콘솔에서 다시 열기" 버튼 링크(예: https://console.example.org). 빈값=버튼 숨김
  secret: ""                 # API↔게이트웨이 공유 토큰키(빈값=deploy.sh 생성 / 랜덤)
  sshPrivateKey: ""          # 게이트웨이 SSH 관리 개인키(PEM). 백엔드로 재접속용.
  sshPublicKey: ""           # 위 개인키의 공개키(OpenSSH). sshd 사이드카·물리계정이 신뢰.
  # 컨테이너 SSH 사이드카 이미지(빈값이면 물리 SSH 만).
  sshdImage: ""
  replicas: 1
  service:
    type: LoadBalancer       # MetalLB 가 IP 할당(80/443/sshPort)
    loadBalancerIP: ""       # 와일드카드 DNS 가 가리킬 고정 IP(MetalLB 풀 내)
  # TLS: 비우면 HTTP 만(테스트베드). 운영은 와일드카드 인증서 Secret 을 지정.
  tls:
    secretName: ""           # kubernetes.io/tls Secret(*.<domain>). 지정 시 HTTPS.

idle:
  timeoutMin: 30

quota:
  maxGpuCount: 64
  maxVramGb: 512
  maxConcurrentSessions: 50
  maxStoppedSessions: 5   # 사용자당 중단(대기) 세션 상한(0=무제한). 중단 세션은 로컬 홈 PVC 로 노드 디스크 점유.
  volumeQuotaGb: 2000
  # 메모리 limit 배수(limit = GPU 지분 비례 보장 × 배수, 1 이하면 상한 없음).
  # 메모리는 압축이 안 돼서 상한이 없으면 한 세션이 노드 RAM 을 말리고 kubelet 이 남의 세션을 축출한다.
  memBurst: 2
  # 중단 세션 홈 회수. 방치 일수와 노드 디스크 사용률을 둘 다 넘겼을 때만 집행한다(0 이면 비활성).
  # 여기 값은 초기값일 뿐이라, 관리자 설정에서 바꾸면 그쪽이 우선한다.
  stoppedTtlDays: 14
  homeReapPct: 88         # nodeCleaner 의 scratch(85)와 home(92) 사이에서 개입

branding:
  name: Giosk
  accent: ""

# ── 최초 플랫폼 관리자 (부트스트랩, 멱등 생성) ────────────────────────
# password 는 설치 시 반드시 지정. Secret 으로 주입된다.
admin:
  username: admin
  password: ""           # 예: --set admin.password=... (빈 값이면 부트스트랩 생략)

# node-agent ↔ API 공유 토큰(물리노드 hybrid). 미지정 시 자동 생성.
agentToken: ""

# ── 데이터베이스 (MySQL 8) ─────────────────────────────────────────
database:
  bundled: true          # true=차트가 클러스터 내 MySQL 함께 배포, false=외부 DB(host 지정)
  host: ""               # bundled=false 일 때만 사용. bundled=true 면 자동(<release>-giosk-mysql)
  port: 3306
  name: giosk
  user: giosk
  password: ""           # 번들 MySQL/접속 비밀번호. 빈 값이면 랜덤 생성(권장: 명시 지정)
  image: mysql:8.0
  storageClass: ""       # 비우면 클러스터 기본 StorageClass. 테스트베드=local-path
  storageSize: 8Gi

api:
  replicas: 1
  corsOrigins: ""        # 단일 오리진(nginx 프록시)이면 불필요. 직접 노출 시 "http://IP" 또는 "*"
  service:
    type: ClusterIP      # 프론트 nginx 가 프록시 → 외부 노출 불필요
    port: 8080

# ── K8s 연동 ───────────────────────────────────────────────────────
k8s:
  gpuTypeLabel: nvidia.com/gpu.product          # 노드 GPU 종류 라벨(GFD)
  cudaLabel: nvidia.com/cuda.driver-version     # 드라이버 버전 라벨(GFD). 없으면 콘솔에 "—"

# ── 프론트엔드 (nginx: 정적 + /api 프록시) ──────────────────────────
frontend:
  replicas: 1
  domain: ""             # 콘솔 도메인(예: console.example.한국). server_name·HTTPS 리다이렉트에 사용. 비우면 아무 호스트(_)
  # secretName 을 주면 nginx 가 443 에서 HTTPS 를 종단하고 80 은 리다이렉트한다.
  # kubernetes.io/tls Secret 을 같은 네임스페이스에 미리 만들어 둬야 한다.
  tls:
    secretName: ""       # 예: giosk-wildcard-tls. 비우면 HTTP(80)만.
  service:
    type: LoadBalancer   # MetalLB 가 IP 할당. nodeport/clusterip 도 가능
    port: 80
    httpsPort: 443       # tls.secretName 지정 시 노출되는 HTTPS 포트
    loadBalancerIP: ""   # 고정 IP 원하면 지정(MetalLB 풀 범위 내). 비우면 자동
    nodePort: ""         # service.type=NodePort 일 때만
