name: build-images

# main 에 push 되면 컨테이너 이미지를 빌드해 GitHub Container Registry(ghcr.io)로 푸시한다.
# 결과 이미지: ghcr.io/<owner>/giosk-{api,node-agent,gateway,sshd,frontend}
# (owner 는 자동 소문자화 → ghcr.io/kim-taehyeong/giosk-api ...)
on:
  push:
    branches: [main]
  workflow_dispatch:   # 수동 실행 버튼

env:
  REGISTRY: ghcr.io

jobs:
  # ── 백엔드 멀티타깃(api/node-agent/gateway/sshd) ──
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # ghcr 로 push 권한
    strategy:
      matrix:
        target: [api, node-agent, gateway, csi, sshd]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/giosk-${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 프론트엔드(nginx: 정적 + /api 프록시) ──
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/giosk-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
